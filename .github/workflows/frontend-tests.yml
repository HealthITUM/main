name: Frontend Tests

on:
  # push:
  #   branches: [main, dev]
  # pull_request:
  #   branches: [main]
  push:
    branches:
      - 'feature/PLANT-119-testing-github-actions'
  workflow_dispatch:

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --workspace=frontend/react-web
      
      - run: npm ci
        working-directory: frontend/react-web
      - run: npm test
        working-directory: frontend/react-web

  mobile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
        working-directory: frontend/react-native-mobile
      - run: npm test
        working-directory: frontend/react-native-mobile