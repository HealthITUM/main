services:
  backend:
    build: 
      context: .
    command: >
      sh -c "npm run db:push && npm run dev"
    container_name: backend
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/src/generated/prisma
    env_file:
      - .env
    environment:
      - DEBUG=appName:*
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15
    container_name: postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
